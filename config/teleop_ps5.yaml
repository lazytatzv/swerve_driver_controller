teleop_twist_joy_node:
  ros__parameters:
    axis_linear:
      x: 1  # 左スティック 縦 (前後進)
      y: 0  # 左スティック 横 (左右カニ歩き)
    scale_linear:
      x: 3.0  # 通常最高速度 3.0 m/s (~10.8 km/h)
      y: 3.0
    scale_linear_turbo:
      x: 6.0  # ターボ時最高速度 6.0 m/s (~21.6 km/h)
      y: 6.0

    axis_angular:
      yaw: 3  # 右スティック 横 (旋回)
    scale_angular:
      yaw: 4.0  # 通常旋回速度 4.0 rad/s (~230 deg/s)
    scale_angular_turbo:
      yaw: 8.0  # ターボ旋回速度 8.0 rad/s (~460 deg/s)

    require_enable_button: false # ボタンを押さずにスティック操作だけで走行可能
    enable_button: -1
    enable_turbo_button: 5  # R1 ボタン (高速ターボ走行)
