teleop_twist_joy_node:
  ros__parameters:
    axis_linear:
      x: 1  # 左スティック 縦 (前後進)
      y: 0  # 左スティック 横 (左右カニ歩き)
    scale_linear:
      x: 1.0
      y: 1.0
    scale_linear_turbo:
      x: 2.0
      y: 2.0

    axis_angular:
      yaw: 3  # 右スティック 横 (旋回)
    scale_angular:
      yaw: 2.0
    scale_angular_turbo:
      yaw: 3.5

    require_enable_button: false # ボタンを押さずにスティック操作だけで走行可能
    enable_button: -1
    enable_turbo_button: 5  # R1 ボタン (高速ターボ走行)
